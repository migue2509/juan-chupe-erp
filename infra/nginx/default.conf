server {
    listen 80;
    server_name _;

    # Frontend (React build)
    location / {
        root /var/www/juan-chupe-erp/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django static
    location /static/ {
        alias /var/www/juan-chupe-erp/backend/staticfiles/;
    }

    # Django media
    location /media/ {
        alias /var/www/juan-chupe-erp/backend/media/;
    }

    client_max_body_size 10M;
}
